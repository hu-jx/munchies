name: frontend_munchies
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  async: ^2.13.1
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_debouncer: ^2.1.1
  google_fonts: ^8.1.0
  http: ^1.6.0
  image_picker: ^1.2.2
  image_picker_platform_interface: ^2.11.1
  mime: ^2.0.0
  plugin_platform_interface: ^2.1.8
  popover: ^0.4.0
  provider: ^6.1.5+1
  table_calendar: ^3.2.0
  tap_debouncer: ^2.2.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets: 
  - assets/login_bg.png
  - assets/images/homepage_background.png



  # To add assets to your application, add an assets section, like this:
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # # example:
  fonts:
    - family: Cherry_Bomb_One
      fonts:
        - asset: assets/font_styles/Cherry_Bomb_One/CherryBombOne-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/font_styles/Poppins/Poppins-Black.ttf
        - asset: assets/font_styles/Poppins/Poppins-Bold.ttf
        - asset: assets/font_styles/Poppins/Poppins-Light.ttf
        - asset: assets/font_styles/Poppins/Poppins-Medium.ttf
        - asset: assets/font_styles/Poppins/Poppins-Regular.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
